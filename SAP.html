<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academic Risk Predictor</title>
</head>
<body style="margin:0; padding:0; background:linear-gradient(135deg, #667EEA 0%, #764BA2 45%, #F093FB 100%); font-family: Georgia, 'Times New Roman', serif; color:#1C2541; min-height:100vh;">

  <div style="max-width:640px; margin:0 auto; padding:48px 24px 80px 24px;">

    <div style="background-color:#FFFFFF; border-radius:16px; box-shadow:0 12px 30px rgba(0,0,0,0.25); padding:36px 32px;">

      <div style="border-bottom:3px solid #764BA2; padding-bottom:18px; margin-bottom:32px;">
        <h1 style="font-size:28px; font-weight:normal; letter-spacing:0.3px; margin:0 0 6px 0; color:#4A2E83;">🎓 Academic Risk Predictor</h1>
        <p style="font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#6B5B95; margin:0; line-height:1.5;">Enter a student's current record to estimate their risk of academic difficulty this semester.</p>
      </div>

      <!-- FORM VIEW -->
      <form id="riskForm" style="display:block;" onsubmit="return handleSubmit(event)">

        <div style="margin-bottom:20px;">
          <label for="x1" style="display:block; font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#5B3E96; font-weight:bold; margin-bottom:6px;">Previous GPA (out of 10)</label>
          <input id="x1" type="number" step="any" name="x1" min="0" max="10" required
            style="width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px; font-family: Verdana, Geneva, sans-serif; border:2px solid #A78BDB; border-radius:8px; background-color:#F6F3FD; color:#1C2541; outline:none;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="x2" style="display:block; font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#2E7DB8; font-weight:bold; margin-bottom:6px;">Attendance percentage (out of 100)</label>
          <input id="x2" type="number" step="any" name="x2" min="0" max="100" required
            style="width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px; font-family: Verdana, Geneva, sans-serif; border:2px solid #7FB8E0; border-radius:8px; background-color:#EFF7FC; color:#1C2541; outline:none;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="x3" style="display:block; font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#1C8C6B; font-weight:bold; margin-bottom:6px;">Internals (out of 100)</label>
          <input id="x3" type="number" step="any" name="x3" min="0" max="100" required
            style="width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px; font-family: Verdana, Geneva, sans-serif; border:2px solid #7FD6B8; border-radius:8px; background-color:#EDFAF4; color:#1C2541; outline:none;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="x4" style="display:block; font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#C2410C; font-weight:bold; margin-bottom:6px;">Backlogs</label>
          <input id="x4" type="number" step="any" name="x4" min="0" max="50" required
            style="width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px; font-family: Verdana, Geneva, sans-serif; border:2px solid #F0A87A; border-radius:8px; background-color:#FDF3EC; color:#1C2541; outline:none;">
        </div>

        <div style="margin-bottom:20px;">
          <label for="x5" style="display:block; font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#B8860B; font-weight:bold; margin-bottom:6px;">Study hours (per week)</label>
          <input id="x5" type="number" step="any" name="x5" min="0" max="130" required
            style="width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px; font-family: Verdana, Geneva, sans-serif; border:2px solid #EBCB7A; border-radius:8px; background-color:#FDF9EC; color:#1C2541; outline:none;">
        </div>

        <div style="margin-bottom:28px;">
          <label for="x6" style="display:block; font-family: Verdana, Geneva, sans-serif; font-size:13px; color:#C2185B; font-weight:bold; margin-bottom:6px;">Courses (current semester)</label>
          <input id="x6" type="number" step="any" name="x6" min="0" max="10" required
            style="width:100%; box-sizing:border-box; padding:11px 12px; font-size:15px; font-family: Verdana, Geneva, sans-serif; border:2px solid #F2A0C4; border-radius:8px; background-color:#FDEFF5; color:#1C2541; outline:none;">
        </div>

        <button type="submit"
          style="width:100%; padding:15px; font-size:15px; font-weight:bold; font-family: Verdana, Geneva, sans-serif; letter-spacing:0.5px; background:linear-gradient(135deg, #667EEA, #764BA2); color:#FFFFFF; border:none; border-radius:10px; cursor:pointer; box-shadow:0 6px 16px rgba(118,75,162,0.4);">
          🔮 Predict
        </button>
      </form>

      <!-- RESULT VIEW -->
      <div id="resultView" style="display:none;">

        <div style="display:flex; justify-content:center; margin:8px 0 30px 0;">
          <svg id="progressSvg" width="220" height="220" viewBox="0 0 220 220">
            <circle cx="110" cy="110" r="95" fill="none" stroke="#EDE9F7" stroke-width="16"></circle>
            <circle id="progressCircle" cx="110" cy="110" r="95" fill="none" stroke="#2E8B57" stroke-width="16"
              stroke-linecap="round" stroke-dasharray="596.9" stroke-dashoffset="596.9"
              transform="rotate(-90 110 110)"
              style="transition: stroke-dashoffset 1s ease, stroke 0.6s ease;"></circle>
            <text id="percentText" x="110" y="103" text-anchor="middle"
              style="font-family: Georgia, serif; font-size:36px; font-weight:bold; fill:#1C2541;">0%</text>
            <text id="levelText" x="110" y="130" text-anchor="middle"
              style="font-family: Verdana, sans-serif; font-size:13px; letter-spacing:0.5px; fill:#6B5B95;">RISK</text>
          </svg>
        </div>

        <div id="levelBanner" style="text-align:center; margin-bottom:30px; padding:14px; font-family: Verdana, Geneva, sans-serif; font-size:14px; border-radius:10px;">
        </div>

        <div style="border-top:3px solid #E4DAFA; padding-top:20px;">
          <h2 style="font-size:16px; font-weight:normal; margin:0 0 16px 0; color:#4A2E83;">📋 Submitted details</h2>

          <table style="width:100%; border-collapse:collapse; font-family: Verdana, Geneva, sans-serif; font-size:13px;">
            <tr>
              <td style="padding:10px 8px; color:#6B5B95; border-bottom:1px solid #EDE9F7; background-color:#F9F7FD; border-radius:6px 0 0 6px;">Previous GPA</td>
              <td id="outX1" style="padding:10px 8px; text-align:right; color:#1C2541; font-weight:bold; border-bottom:1px solid #EDE9F7; background-color:#F9F7FD; border-radius:0 6px 6px 0;"></td>
            </tr>
            <tr><td colspan="2" style="height:6px;"></td></tr>
            <tr>
              <td style="padding:10px 8px; color:#2E7DB8; background-color:#EFF7FC; border-radius:6px 0 0 6px;">Attendance percentage</td>
              <td id="outX2" style="padding:10px 8px; text-align:right; color:#1C2541; font-weight:bold; background-color:#EFF7FC; border-radius:0 6px 6px 0;"></td>
            </tr>
            <tr><td colspan="2" style="height:6px;"></td></tr>
            <tr>
              <td style="padding:10px 8px; color:#1C8C6B; background-color:#EDFAF4; border-radius:6px 0 0 6px;">Internals</td>
              <td id="outX3" style="padding:10px 8px; text-align:right; color:#1C2541; font-weight:bold; background-color:#EDFAF4; border-radius:0 6px 6px 0;"></td>
            </tr>
            <tr><td colspan="2" style="height:6px;"></td></tr>
            <tr>
              <td style="padding:10px 8px; color:#C2410C; background-color:#FDF3EC; border-radius:6px 0 0 6px;">Backlogs</td>
              <td id="outX4" style="padding:10px 8px; text-align:right; color:#1C2541; font-weight:bold; background-color:#FDF3EC; border-radius:0 6px 6px 0;"></td>
            </tr>
            <tr><td colspan="2" style="height:6px;"></td></tr>
            <tr>
              <td style="padding:10px 8px; color:#B8860B; background-color:#FDF9EC; border-radius:6px 0 0 6px;">Study hours per week</td>
              <td id="outX5" style="padding:10px 8px; text-align:right; color:#1C2541; font-weight:bold; background-color:#FDF9EC; border-radius:0 6px 6px 0;"></td>
            </tr>
            <tr><td colspan="2" style="height:6px;"></td></tr>
            <tr>
              <td style="padding:10px 8px; color:#C2185B; background-color:#FDEFF5; border-radius:6px 0 0 6px;">Courses this semester</td>
              <td id="outX6" style="padding:10px 8px; text-align:right; color:#1C2541; font-weight:bold; background-color:#FDEFF5; border-radius:0 6px 6px 0;"></td>
            </tr>
          </table>
        </div>

        <button type="button" onclick="resetForm()"
          style="width:100%; margin-top:28px; padding:14px; font-size:15px; font-weight:bold; font-family: Verdana, Geneva, sans-serif; letter-spacing:0.5px; background:linear-gradient(135deg, #F093FB, #F5576C); color:#FFFFFF; border:none; border-radius:10px; cursor:pointer; box-shadow:0 6px 16px rgba(245,87,108,0.4);">
          🔁 Check another student
        </button>
      </div>

    </div>
  </div>

<script>
  function handleSubmit(event) {
    event.preventDefault();

    var gpa = parseFloat(document.getElementById('x1').value);
    var attendance = parseFloat(document.getElementById('x2').value);
    var internals = parseFloat(document.getElementById('x3').value);
    var backlogs = parseFloat(document.getElementById('x4').value);
    var studyHours = parseFloat(document.getElementById('x5').value);
    var courses = parseFloat(document.getElementById('x6').value);

    // --- Risk calculation ---
    var gpaScore = (gpa / 10) * 35;
    var attendanceScore = (attendance / 100) * 25;
    var internalsScore = (internals / 100) * 25;

    var idealHours = Math.max(courses, 1) * 4;
    var studyRatio = idealHours > 0 ? studyHours / idealHours : 0;
    if (studyRatio > 1) studyRatio = 1;
    var studyScore = studyRatio * 10;

    var backlogPenalty = backlogs * 6;
    var overloadPenalty = courses > 6 ? (courses - 6) * 3 : 0;

    var successScore = gpaScore + attendanceScore + internalsScore + studyScore - backlogPenalty - overloadPenalty;
    if (successScore > 100) successScore = 100;
    if (successScore < 0) successScore = 0;

    var riskScore = Math.round(100 - successScore);
    if (riskScore > 100) riskScore = 100;
    if (riskScore < 0) riskScore = 0;

    // --- Determine color and label ---
    var color, label, bannerBg, bannerText;
    if (riskScore < 34) {
      color = '#2E8B57';
      label = 'LOW RISK';
      bannerBg = '#E1F7EC';
      bannerText = '#1C7A4E';
    } else if (riskScore < 67) {
      color = '#E8A33D';
      label = 'MODERATE RISK';
      bannerBg = '#FDF0DA';
      bannerText = '#9A5F0B';
    } else {
      color = '#F5576C';
      label = 'HIGH RISK';
      bannerBg = '#FDE3E7';
      bannerText = '#B8203A';
    }

    // --- Update circular progress ---
    var circumference = 596.9;
    var offset = circumference - (riskScore / 100) * circumference;
    var progressCircle = document.getElementById('progressCircle');
    progressCircle.style.stroke = color;
    progressCircle.setAttribute('stroke-dashoffset', circumference);
    setTimeout(function () {
      progressCircle.setAttribute('stroke-dashoffset', offset);
    }, 50);

    document.getElementById('percentText').textContent = riskScore + '%';
    document.getElementById('percentText').style.fill = color;
    document.getElementById('levelText').textContent = label;

    var banner = document.getElementById('levelBanner');
    banner.textContent = riskScore < 34
      ? '✅ This student shows strong indicators. Continue current habits.'
      : riskScore < 67
      ? '⚠️ This student shows some warning signs. Recommend closer monitoring.'
      : '🚨 This student shows significant warning signs. Recommend immediate academic support.';
    banner.style.backgroundColor = bannerBg;
    banner.style.color = bannerText;

    document.getElementById('outX1').textContent = gpa + ' / 10';
    document.getElementById('outX2').textContent = attendance + ' %';
    document.getElementById('outX3').textContent = internals + ' / 100';
    document.getElementById('outX4').textContent = backlogs;
    document.getElementById('outX5').textContent = studyHours + ' hrs/week';
    document.getElementById('outX6').textContent = courses;

    document.getElementById('riskForm').style.display = 'none';
    document.getElementById('resultView').style.display = 'block';

    window.scrollTo(0, 0);
    return false;
  }

  function resetForm() {
    document.getElementById('riskForm').reset();
    document.getElementById('resultView').style.display = 'none';
    document.getElementById('riskForm').style.display = 'block';
    window.scrollTo(0, 0);
  }
</script>

</body>
</html>
